[project]
name = "healthcare-rag-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cohere>=6.1.0",
    "docling>=2.92.0",
    "google-genai>=1.74.0",
    "httpx>=0.28.1",
    "langchain>=1.0",
    "langchain-google-genai>=4.2.2",
    "langgraph>=1.1.10",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.4.1",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "ipython>=9.13.0",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
eval = [
    "datasets>=4.8.5",
    "ragas>=0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare_rag"]