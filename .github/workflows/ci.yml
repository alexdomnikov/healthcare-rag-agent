name: CI

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra eval

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-v1.5
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Lint
        run: uv run ruff check src/ eval/ scripts/ tests/

      - name: Tests
        env:
          DATABASE_URL: postgresql://fake/fake
        run: uv run pytest -m "not slow"

      - name: Eval (smoke subset)
        # Reranker disabled here because the cross-encoder is CPU-bound and slow
        # on GitHub runners (multi-minute hit per query). Local/prod still rerank.
        # Recall@5 threshold lowered to match no-rerank baseline (full eval w/
        # rerank-off scores 0.611 on 18 doc questions; see docs/ablations.md).
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DISABLE_RERANKER: "1"
        run: uv run python eval/run_eval.py --subset smoke --threshold-recall5 0.5 --threshold-routing 0.8
